<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none" role="img" aria-label="StudyHub Logo">
  <defs>
    <linearGradient id="shGrad" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(6, 6)">
    <!-- Shield/Book base -->
    <rect x="0" y="2" width="44" height="44" rx="10" fill="url(#shGrad)" />
    <!-- Book open pages -->
    <path d="M12 32C16 30 20 30 22 31V16C20 15 16 15 12 17V32Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M32 32C28 30 24 30 22 31V16C24 15 28 15 32 17V32Z" fill="#ffffff" fill-opacity="0.8" />
    <!-- Center spine spine accent -->
    <line x1="22" y1="16" x2="22" y2="33" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <!-- Subtle amber star/compass dot -->
    <circle cx="22" cy="11" r="2.5" fill="#f59e0b" />
  </g>
  <!-- Wordmark -->
  <text x="64" y="33" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5px" fill="currentColor">
    Study<tspan fill="#d97706">Hub</tspan>
  </text>
  <text x="65" y="46" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.2px" fill="currentColor" opacity="0.6">
    EDUCATIONAL DISCOVERY
  </text>
</svg>
